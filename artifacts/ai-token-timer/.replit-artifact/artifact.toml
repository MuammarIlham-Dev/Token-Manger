kind = "web"
previewPath = "/"
title = "Token Manager"
description = "A local-first progressive web app for organizing AI account profiles and tracking independent token refresh and quota reset timers."
version = "1.1.0"
id = "artifacts/ai-token-timer"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24437

[services.development]
run = "pnpm --filter @workspace/ai-token-timer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-token-timer", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-token-timer/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24437"
BASE_PATH = "/"
